name: exif_kit
description: Read and write EXIF (GPS, orientation, dates, camera settings) on Android via androidx ExifInterface, with a pure-Dart JPEG reader fallback.
version: 0.1.0
homepage: https://abdeldjalilchougui.biz/
repository: https://github.com/AbeldjalilChougui/exif_kit
issue_tracker: https://github.com/AbeldjalilChougui/exif_kit/issues
topics:
  - exif
  - image
  - metadata
  - gps
  - android

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.abdeldjalilchougui.exif_kit
        pluginClass: ExifKitPlugin
